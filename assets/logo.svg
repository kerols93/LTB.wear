<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Sharp Streetwear Shadow -->
    <filter id="crispShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean White Background Box -->
  <rect x="6" y="6" width="508" height="128" rx="16" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5" filter="url(#crispShadow)"/>

  <!-- Streetwear Icon / Geometric Monogram Box -->
  <g transform="translate(24, 20)">
    <!-- Black Box Emblem with White Streetwear Cutouts -->
    <rect x="0" y="0" width="100" height="100" rx="14" fill="#0A0A0A" />
    
    <!-- Accent Top Corner Dot / Tag -->
    <rect x="10" y="10" width="14" height="4" fill="#FF5E15" rx="2" />
    
    <!-- Bold Geometric Monogram "LTB" -->
    <text x="50" y="62" font-family="'Cairo', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      LTB
    </text>
    
    <!-- Sub-tag inside emblem -->
    <rect x="22" y="74" width="56" height="13" rx="4" fill="#FF5E15" />
    <text x="50" y="84" font-family="'Cairo', 'Segoe UI', sans-serif" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      WEAR
    </text>
  </g>

  <!-- Main Brand Typography: LTB.wear -->
  <!-- "LTB" in Heavy Black, ".wear" in Crisp Accent/Black -->
  <text x="142" y="72" font-family="'Cairo', 'Poppins', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="48" fill="#0A0A0A" letter-spacing="1.5">
    LTB<tspan fill="#FF5E15">.</tspan><tspan font-weight="700" font-size="42" fill="#222222">wear</tspan>
  </text>

  <!-- Modern Arabic Subtitle / Tagline for Men & Youth -->
  <text x="145" y="104" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="800" font-size="16" fill="#555555" letter-spacing="0.8">
    أزياء شبابية ورجالية • براند ستريت وير مصري
  </text>

  <!-- Streetwear Accent Tag Line & Visual Accent -->
  <line x1="430" y1="36" x2="494" y2="36" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" />
  <circle cx="488" cy="52" r="4.5" fill="#FF5E15" />
  <line x1="450" y1="52" x2="476" y2="52" stroke="#CCCCCC" stroke-width="2" stroke-linecap="round" />
</svg>
