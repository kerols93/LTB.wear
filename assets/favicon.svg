<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Crisp White Background with subtle dark border -->
  <rect width="120" height="120" rx="28" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/>
  
  <!-- Centered Streetwear Emblem -->
  <g transform="translate(18, 18)">
    <rect width="84" height="84" rx="16" fill="#0A0A0A" />
    
    <!-- Streetwear Accent Dot -->
    <circle cx="70" cy="18" r="4" fill="#FF5E15" />
    
    <!-- Bold LTB text -->
    <text x="42" y="52" font-family="'Cairo', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      LTB
    </text>
    
    <!-- Mini Tag -->
    <rect x="22" y="60" width="40" height="11" rx="3" fill="#FF5E15" />
    <text x="42" y="69" font-family="'Cairo', sans-serif" font-weight="800" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      WEAR
    </text>
  </g>
</svg>
